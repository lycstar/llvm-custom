name: Build LLVM for Android (bionic arm64)
# 复用上游 reusable workflow, 构建脚本零改动; 产物挂本仓 llvm-r<ver> release,
# android-ndk-custom 的 make-ndk.sh 按 REPO_OWNER 从这里取。
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "版本矩阵(JSON): NDK 版本+修订字母"
        required: false
        type: string
        default: '[{"version":"26","revision":"d"},{"version":"27","revision":"d"},{"version":"28","revision":"c"},{"version":"29","revision":""}]'
      only:
        description: "只要这些目标(JSON)"
        required: false
        type: string
        default: '["aarch64-linux-android"]'

permissions:
  contents: write
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.versions) }}
    uses: ./.github/workflows/build-llvm.yml
    secrets: inherit
    with:
      platform: bionic
      version: ${{ matrix.version }}
      revision: ${{ matrix.revision }}
      projects: "bolt;clang;clang-tools-extra;lld;polly"
      # PGO profile 从本仓 releases/download/profdata 取, fork 里没有: 关掉
      pgo: false
      mlgo: true
      lto: true
      only: ${{ inputs.only }}
      targets: '["aarch64-linux-android", "armv7a-linux-androideabi", "i686-linux-android", "x86_64-linux-android"]'
